name: Ferry PHP upgrade scan
description: Scan a PHP project for code that breaks on a newer PHP version and report it on pull requests.
branding:
  icon: anchor
  color: purple
inputs:
  target:
    description: PHP version to check against (8.2, 8.3, 8.4 or 8.5)
    required: true
  path:
    description: Project folder to scan
    default: "."
  fail-on:
    description: breaking, deprecated, any, new or none
    default: breaking
  baseline:
    description: Baseline file written by ferry-cli --write-baseline, from the repository root; with it only new findings fail the job
    default: ""
  sarif:
    description: Also write ferry.sarif for upload to GitHub code scanning
    default: "false"
  allow-incomplete:
    description: Don't fail the job when some files couldn't be scanned
    default: "false"
runs:
  using: composite
  steps:
    - id: source
      shell: bash
      run: |
        digest() { if command -v sha256sum >/dev/null; then sha256sum; else shasum -a 256; fi; }
        key=$(cd "$GITHUB_ACTION_PATH" && find Cargo.toml Cargo.lock crates -type f -not -path '*/target/*' | LC_ALL=C sort | while read -r f; do printf '%s\n' "$f"; cat "$f"; done | digest | cut -c1-20)
        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "dir=$HOME/.ferry-action/$key" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.source.outputs.dir }}
        key: ferry-cli-${{ runner.os }}-${{ steps.source.outputs.key }}
    - shell: bash
      env:
        DIR: ${{ steps.source.outputs.dir }}
      run: |
        ls "$DIR"/bin/ferry-cli* >/dev/null 2>&1 || cargo install --locked --root "$DIR" --path "$GITHUB_ACTION_PATH/crates/ferry-cli"
    - shell: bash
      env:
        FERRY: ${{ steps.source.outputs.dir }}/bin/ferry-cli
        TARGET: ${{ inputs.target }}
        PROJECT: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
        BASELINE: ${{ inputs.baseline }}
        SARIF: ${{ inputs.sarif }}
        ALLOW_INCOMPLETE: ${{ inputs.allow-incomplete }}
      run: |
        args=(scan "$PROJECT" --target "$TARGET" --fail-on "$FAIL_ON")
        args+=(--path-prefix "$PROJECT")
        if [ -n "$BASELINE" ]; then args+=(--baseline "$BASELINE"); fi
        if [ "$ALLOW_INCOMPLETE" = "true" ]; then args+=(--allow-incomplete); fi
        if [ "$SARIF" = "true" ]; then "$FERRY" "${args[@]}" --format sarif --output ferry.sarif --fail-on none --allow-incomplete; fi
        "$FERRY" "${args[@]}" --format github
