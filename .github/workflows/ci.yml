name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:
    inputs:
      macos:
        description: "Run the macOS test job"
        type: boolean
        default: false
      bundle:
        description: "Build macOS and Windows installers"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
      - run: pnpm install --frozen-lockfile
      - name: Frontend
        run: |
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Install Rector
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          composer require rector/rector --working-dir "$RUNNER_TEMP/tools" --no-interaction --no-progress
          echo "FERRY_TEST_TOOLS=$RUNNER_TEMP/tools" >> "$GITHUB_ENV"
      - name: Core
        run: |
          cargo clippy -p ferry-core --all-targets -- -D warnings
          cargo test -p ferry-core

  windows:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Rector
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          composer require rector/rector --working-dir "$RUNNER_TEMP/tools" --no-interaction --no-progress
          echo "FERRY_TEST_TOOLS=$RUNNER_TEMP/tools" >> "$GITHUB_ENV"
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  macos:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.macos || inputs.bundle
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  bundle:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.bundle
    needs: [windows, macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: ferry-${{ matrix.os }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
