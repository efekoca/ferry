name: Image digests

on:
  schedule:
    - cron: "23 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: node scripts/update-image-digests.mjs
      - name: Offer the new digests
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Refresh the Docker image digests
          BRANCH: chore/image-digests
        run: |
          git diff --quiet && exit 0
          compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1"
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            url=$(gh issue create --title "$TITLE" --body "The pinned images have new digests. [Open a pull request]($compare) to test them.")
            number=${url##*/}
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "$TITLE" -m "Closes #$number"
          git push --force origin "HEAD:refs/heads/$BRANCH"
